<!DOCTYPE html>
<html>
    <head>
        <title>HTML Text fomatting</title>
    </head>

    <body>
        <h1>HTML text formating</h1>

        <p>
            <b> this is a bold text using the b tag</b>
        </p>

        <p>
            <strong> this is a strong text using the strong tag</strong>
        </p>

        <p>
            <i>this is a italic text using the i tag</i>
        </p>

        <p> 
            <em>this is Emphasis text using the em tag</em>
        </p>

        <p>
            <u></u>
        </p>


    </body>
</html>
